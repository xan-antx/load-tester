# Serves the built app and forwards API calls to the backend container, so the
# browser talks to one origin (http://localhost:8080) for both.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # An analyze probe can take ~15 s against a slow target.
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://backend:5000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
